foco = "#007E7D"
fundo = "#F5F8F8"
superficie = "#FFFFFF"
bordas = "#DCE6E5"
texto = "#183439"
# Teal da marca abrindo a paleta de referência validada para daltonismo (validador da skill de dataviz).
series = ["#008F88", "#EB6834", "#2A78D6", "#EDA100", "#E87BA4", "#008300", "#6250D6", "#E34948"]

