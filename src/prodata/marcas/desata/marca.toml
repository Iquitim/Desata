# Marca Desata (spec 036). Desate a complexidade. Conecte possibilidades.
# Símbolo: a triqueta reinterpretada como um nó que se desata em conexões de dados.
# Paleta principal: Petróleo #003F46 (institucional), Teal #007E7D (apoio), Verde fluxo #21C7A4 (acento).
# Tipografia: Manrope nos títulos, Inter no texto, JetBrains Mono em SQL e fórmulas.

nome = "Desata"
nome_curto = "Desata"
slogan = "Desate a complexidade. Conecte possibilidades."
fonte_texto = "Inter"
fonte_titulos = "Manrope"
fonte_codigo = "JetBrains Mono"
# Fundos de identidade (abertura, instalador, capa do guia): de Petróleo a Teal, onde o texto branco lê bem.
# O Verde fluxo entra como faixa de acento (organizacao), não atrás de texto (contraste 2,2:1 com branco).
gradiente = ["#003F46", "#007E7D"]
# Capa do guia com o logo grande ao centro.
capa = "centralizada"

[instalacao]
app_id = "F73F722E-C478-445D-A511-5EECD65804F6"
editora = "Desata"
pasta_dados = "Desata"
cofre = "DESATA"
# Quem já usa o PRO.DATA neste computador pode trazer fontes, fluxos, organização e senhas na primeira abertura.
migrar_de = [{ pasta = "PRO.DATA", cofre = "PRODATA", nome = "PRO.DATA" }]

[cores.claro]
barra = "#003F46"
barra_borda = "#21C7A4"
barra_texto = "#FFFFFF"
selecao_fundo = "#FFFFFF"
selecao_texto = "#003F46"
realce = "#21C7A4"
